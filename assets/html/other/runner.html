<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HTML Code Runner</title>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    @font-face{font-family:'ApplePixel';src:url('https://quantil.jsdelivr.net/gh/bradardeletethis/apple/font.woff2') format('woff2');font-weight:400;font-style:normal;}

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #050001;
      --accent: #ff6600;
      --accent-rgb: 255, 102, 0;
      --accent-dim: rgba(var(--accent-rgb), 0.15);
      --accent-glow: rgba(var(--accent-rgb), 0.5);
      --accent-glow-strong: rgba(var(--accent-rgb), 0.8);
      --accent-glow-soft: rgba(var(--accent-rgb), 0.15);
      --panel: rgba(16, 16, 20, 0.85);
      --border: rgba(var(--accent-rgb), 0.35);
      --beez-gold: #ff6600;
      --beez-gold-bright: #ff8c00;
      --beez-gold-dark: #cc5200;
      --text: #f4f4f5;
      --muted: #a0a0aa;
      --tab-bg: #0a0700;
      --tab-active: #120b04;
      --header-h: 52px;
      --tab-bar-h: 44px;
    }

    body {
      background:
        radial-gradient(circle at 30% 70%, rgba(var(--accent-rgb), 0.10), transparent 60%),
        radial-gradient(circle at 70% 30%, rgba(var(--accent-rgb), 0.07), transparent 60%),
        var(--bg);
      color: var(--text);
      font-family: 'ApplePixel', 'Lexend', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── TOP BAR ── */
    header {
      height: var(--header-h);
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 18px;
      gap: 14px;
      flex-shrink: 0;
      position: relative;
    }

    header h1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.04em;
      text-shadow: 0 0 18px var(--accent-glow);
      flex: 1;
    }

    .header-actions { display: flex; gap: 10px; }

    .btn {
      background: transparent;
      border: 1.5px solid var(--border);
      color: var(--text);
      font-family: 'Lexend', sans-serif;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 18px;
      border-radius: 7px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, box-shadow 0.2s, background 0.2s;
      white-space: nowrap;
    }

    .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .btn-run {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .btn-run:hover {
      background: var(--accent);
      color: #000;
      box-shadow: 0 0 16px var(--accent-glow);
    }

    .btn-run span { position: relative; z-index: 1; }

    .btn-run.running {
      background: var(--accent);
      color: #000;
    }

    .toggle-panel-btn {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
    }

    .toggle-panel-btn:hover {
      background: var(--accent);
      color: #000;
      box-shadow: 0 0 16px var(--accent-glow);
    }

    /* ── MAIN LAYOUT ── */
    .workspace {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ── LEFT PANEL ── */
    .left-panel {
      width: 50%;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      transition: width 0.35s cubic-bezier(0.4,0,0.2,1), opacity 0.35s;
      overflow: hidden;
      flex-shrink: 0;
    }

    .left-panel.collapsed {
      width: 0 !important;
      opacity: 0;
      pointer-events: none;
    }

    /* ── TAB BAR ── */
    .tab-bar {
      height: var(--tab-bar-h);
      background: var(--tab-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: stretch;
      flex-shrink: 0;
      padding: 0 8px;
      gap: 4px;
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 16px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      border-bottom: 2px solid transparent;
      transition: color 0.2s, border-color 0.2s;
      user-select: none;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .tab:hover { color: var(--text); }

    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .tab-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-html { background: #e34c26; }
    .dot-css  { background: #264de4; }
    .dot-js   { background: #f7df1e; }

    /* ── CODE PANES ── */
    .code-panes {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    .code-pane {
      display: none;
      flex: 1;
      min-height: 0;
      min-width: 0;
    }

    .code-pane.active { display: flex; }

    .line-numbers-wrap {
      flex: 1;
      display: flex;
      overflow: hidden;
      min-width: 0;
    }

    .line-numbers {
      background: #0d0700;
      color: #a0a0aa;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      line-height: 1.7;
      padding: 14px 10px 14px 14px;
      text-align: right;
      width: 46px;
      min-width: 46px;
      max-width: 46px;
      user-select: none;
      overflow: hidden;
      border-right: 1px solid var(--border);
      flex-shrink: 0;
      white-space: pre;
    }

    textarea.code {
      flex: 1;
      min-width: 0;
      width: 0;
      background: var(--tab-active);
      color: var(--text);
      border: none;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      line-height: 1.7;
      padding: 14px 16px;
      resize: none;
      outline: none;
      overflow: auto;
      tab-size: 2;
      white-space: pre-wrap;
      word-break: break-all;
    }

    textarea.code::placeholder { color: #2a2a2a; }
    textarea.code::selection   { background: var(--accent-dim); }

    /* ── RIGHT PANEL ── */
    .right-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .preview-bar {
      height: var(--tab-bar-h);
      background: var(--tab-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 10px;
      flex-shrink: 0;
    }

    .preview-bar-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-size: 11px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #2a2a2a;
      transition: background 0.3s, box-shadow 0.3s;
      margin-left: auto;
    }

    .status-dot.live {
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    #output {
      flex: 1;
      border: none;
      background: #000;
      display: block;
      width: 100%;
      color-scheme: dark;
    }


    /* ── CONSOLE ── */
    .console-panel {
      height: 180px;
      background: #0d0700;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .console-bar {
      height: 34px;
      background: var(--tab-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
      flex-shrink: 0;
    }

    .console-bar-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      flex: 1;
    }

    .console-clear-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-family: 'Lexend', sans-serif;
      font-size: 11px;
      cursor: pointer;
      padding: 3px 8px;
      border-radius: 4px;
      transition: color 0.2s, background 0.2s;
    }

    .console-clear-btn:hover { color: var(--text); background: var(--border); }

    .console-output {
      flex: 1;
      overflow-y: auto;
      padding: 8px 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      line-height: 1.6;
    }

    .console-output::-webkit-scrollbar { width: 4px; }
    .console-output::-webkit-scrollbar-track { background: transparent; }
    .console-output::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .log-line { display: flex; gap: 10px; padding: 1px 0; border-bottom: 1px solid #111; }
    .log-line:last-child { border-bottom: none; }
    .log-type { width: 14px; flex-shrink: 0; opacity: 0.6; }
    .log-text { color: var(--text); word-break: break-all; flex: 1; }
    .log-line.log-error .log-text { color: #f87171; }
    .log-line.log-warn  .log-text { color: #fbbf24; }
    .log-line.log-info  .log-text { color: #60a5fa; }
    .log-empty { color: var(--muted); font-size: 11px; padding: 4px 0; }
    footer {
      height: 26px;
      background: var(--panel);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      font-size: 11px;
      color: var(--muted);
      flex-shrink: 0;
      gap: 16px;
    }

    footer span { letter-spacing: 0.03em; }
    footer .sep { color: var(--border); }

    .kbd {
      background: var(--border);
      border-radius: 3px;
      padding: 1px 5px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: #888;
    }

    /* ── SPLITTER ── */
    .splitter {
      width: 7px;
      flex-shrink: 0;
      cursor: col-resize;
      background: var(--tab-bg);
      border-right: 1px solid var(--border);
      position: relative;
      z-index: 5;
    }

    .splitter::after {
      content: '';
      position: absolute;
      inset: 0 2px;
      background: var(--border);
      border-radius: 2px;
      transition: background 0.2s;
    }

    .splitter:hover::after, .splitter.dragging::after { background: var(--accent); }

    /* ── PREVIEW BAR CONTROLS ── */
    select.tool-select {
      background: var(--tab-active);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text);
      font-size: 11px;
      font-weight: 600;
      padding: 3px 6px;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    select.tool-select:focus { border-color: var(--accent); box-shadow: 0 0 8px var(--accent-glow); }

    .auto-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    .auto-toggle input { accent-color: var(--accent); cursor: pointer; }

    /* ── TOAST ── */
    #toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      background: #1a1a1a;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 9px 20px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 0 20px var(--accent-glow);
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      letter-spacing: 0.02em;
    }

    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
    }

    @media (max-width: 820px) {
      .workspace { flex-direction: column; }
      .left-panel { width: 100% !important; height: 52%; border-right: none; border-bottom: 1px solid var(--border); }
      .right-panel { flex: 1; width: 100%; }
      .splitter { display: none; }
      .console-panel { height: 30%; }
      .header-actions { gap: 6px; }
      .toggle-panel-btn { display: none; }
    }

    /* ── UB LOOK ── */
    .btn, .btn-run, .toggle-panel-btn, header h1, .tab, .preview-bar-label, .console-bar-label, .console-clear-btn {
      font-family: 'ApplePixel', 'Lexend', sans-serif;
    }
  </style>
</head>
<body>

  <header>
    <h1>⚡ HTML Code Runner</h1>
    <div class="header-actions">
      <button class="btn toggle-panel-btn" id="toggleBtn" onclick="togglePanel()">‹ Hide Editor</button>
      <button class="btn" onclick="clearCode()">Clear</button>
      <button class="btn btn-run" id="runButton" onclick="runCode()"><span id="runLabel">▶ Run</span></button>
    </div>
  </header>

  <div class="workspace">

    <!-- LEFT: EDITOR -->
    <div class="left-panel" id="leftPanel">
      <div class="tab-bar" role="tablist" aria-label="Editor tabs">
        <div class="tab active" id="tab-html" role="tab" aria-selected="true" onclick="switchTab('html')">
          <span class="tab-dot dot-html"></span>HTML
        </div>
        <div class="tab" id="tab-css" role="tab" aria-selected="false" onclick="switchTab('css')">
          <span class="tab-dot dot-css"></span>CSS
        </div>
        <div class="tab" id="tab-js" role="tab" aria-selected="false" onclick="switchTab('js')">
          <span class="tab-dot dot-js"></span>JavaScript
        </div>
      </div>

      <div class="code-panes">
        <div class="code-pane active" id="pane-html">
          <div class="line-numbers-wrap">
            <div class="line-numbers" id="ln-html">1</div>
            <textarea class="code" id="htmlCode" placeholder="<!-- HTML goes here -->" spellcheck="false"></textarea>
          </div>
        </div>
        <div class="code-pane" id="pane-css">
          <div class="line-numbers-wrap">
            <div class="line-numbers" id="ln-css">1</div>
            <textarea class="code" id="cssCode" placeholder="/* CSS goes here */" spellcheck="false"></textarea>
          </div>
        </div>
        <div class="code-pane" id="pane-js">
          <div class="line-numbers-wrap">
            <div class="line-numbers" id="ln-js">1</div>
            <textarea class="code" id="jsCode" placeholder="// JavaScript goes here" spellcheck="false"></textarea>
          </div>
        </div>
      </div>
    </div>

    <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" aria-label="Resize editor"
      title="Drag to resize"></div>

<!-- RIGHT: PREVIEW -->
    <div class="right-panel">
      <div class="preview-bar">
        <span class="preview-bar-label">Output Preview</span>
        <label class="auto-toggle" title="Live-reload while you type">
          <input type="checkbox" id="autoRun" /> <span>Auto</span>
        </label>
        <select class="tool-select" id="libSelect" aria-label="Inject library" onchange="injectLib()">
          <option value="">+ Lib</option>
          <option value="jquery">jQuery</option>
          <option value="bootstrap">Bootstrap</option>
          <option value="tailwind">Tailwind</option>
          <option value="font-awesome">Font Awesome</option>
          <option value="anime">Anime.js</option>
          <option value="canvas-confetti">Canvas Confetti</option>
          <option value="axios">Axios</option>
        </select>
        <div class="status-dot" id="statusDot"></div>
      </div>
      <iframe id="output" title="Code output preview"></iframe>
      <div class="console-panel">
        <div class="console-bar">
          <span class="console-bar-label">Console</span>
          <span id="consoleCount" style="font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;"></span>
          <button class="console-clear-btn" onclick="clearConsole()">Clear</button>
        </div>
        <div class="console-output" id="consoleOutput">
          <span class="log-empty">Console output will appear here…</span>
        </div>
      </div>
    </div>

  </div>

  <footer>
    <span>HTML Code Runner</span>
    <span class="sep">|</span>
    <span><span class="kbd">Ctrl+Enter</span> to run</span>
    <span class="sep">|</span>
    <span>made by UNBL0CKEDZ0NE</span>
  </footer>

  <div id="toast" role="status" aria-live="polite"></div>

  <script>
    let panelVisible = true;
    let activeTab = 'html';

    /* ── TAB SWITCHING ── */
    function switchTab(name) {
      activeTab = name;
      document.querySelectorAll('.tab').forEach(t => {
        t.classList.remove('active');
        t.setAttribute('aria-selected', 'false');
      });
      document.querySelectorAll('.code-pane').forEach(p => p.classList.remove('active'));
      const tab = document.getElementById('tab-' + name);
      tab.classList.add('active');
      tab.setAttribute('aria-selected', 'true');
      document.getElementById('pane-' + name).classList.add('active');
      updateLineNumbers(name);
    }

    /* ── LINE NUMBERS ── */
    function updateLineNumbers(id) {
      const ta = document.getElementById(id === 'html' ? 'htmlCode' : id === 'css' ? 'cssCode' : 'jsCode');
      const ln = document.getElementById('ln-' + id);
      const lines = ta.value.split('\n').length;
      ln.textContent = Array.from({length: lines}, (_, i) => i + 1).join('\n');
      ln.scrollTop = ta.scrollTop;
    }

    ['html','css','js'].forEach(id => {
      const taId = id === 'html' ? 'htmlCode' : id === 'css' ? 'cssCode' : 'jsCode';
      const ta = document.getElementById(taId);
      ta.addEventListener('input', () => { updateLineNumbers(id); scheduleAutoRun(); });
      ta.addEventListener('scroll', () => {
        const ln = document.getElementById('ln-' + id);
        ln.scrollTop = ta.scrollTop;
      });
      ta.addEventListener('keydown', e => {
        if (e.key === 'Tab') {
          e.preventDefault();
          const start = ta.selectionStart;
          const end = ta.selectionEnd;
          ta.value = ta.value.substring(0, start) + '  ' + ta.value.substring(end);
          ta.selectionStart = ta.selectionEnd = start + 2;
          updateLineNumbers(id);
        }
        if (e.ctrlKey && e.key === 'Enter') runCode();
      });
    });

    /* ── TOGGLE PANEL ── */
    function togglePanel() {
      panelVisible = !panelVisible;
      const panel = document.getElementById('leftPanel');
      const btn   = document.getElementById('toggleBtn');
      if (panelVisible) {
        panel.classList.remove('collapsed');
        btn.textContent = '‹ Hide Editor';
      } else {
        panel.classList.add('collapsed');
        btn.textContent = '› Show Editor';
      }
    }

    /* ── CONSOLE ── */
    let logCount = 0;

    function showToast(msg, isError = false) {
      const t = document.getElementById('toast');
      if (!t) return;
      t.textContent = msg;
      t.style.borderColor = isError ? '#f87171' : 'var(--accent)';
      t.style.color = isError ? '#f87171' : 'var(--accent)';
      t.style.boxShadow = isError ? '0 0 20px rgba(248,113,113,0.4)' : '0 0 20px var(--accent-glow)';
      t.classList.add('show');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => t.classList.remove('show'), 2600);
    }

    function clearConsole() {
      logCount = 0;
      document.getElementById('consoleOutput').innerHTML = '<span class="log-empty">Console output will appear here…</span>';
      document.getElementById('consoleCount').textContent = '';
    }

    function appendLog(type, args) {
      const out = document.getElementById('consoleOutput');
      // Remove placeholder
      const empty = out.querySelector('.log-empty');
      if (empty) empty.remove();

      logCount++;
      document.getElementById('consoleCount').textContent = logCount + ' message' + (logCount !== 1 ? 's' : '');

      const icons = { log: '›', error: '✕', warn: '⚠', info: 'ℹ' };
      const line = document.createElement('div');
      line.className = 'log-line log-' + type;
      line.innerHTML = `<span class="log-type">${icons[type] || '›'}</span><span class="log-text">${escHtml(args)}</span>`;
      out.appendChild(line);
      out.scrollTop = out.scrollHeight;
    }

    function escHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    window.addEventListener('message', e => {
      if (e.data && e.data.__consoleType) {
        appendLog(e.data.__consoleType, e.data.__consoleArgs);
      }
    });

    /* ── PERSISTENCE ── */
    const CODE_KEYS = { html: 'ubRunner_html', css: 'ubRunner_css', js: 'ubRunner_js' };

    function saveAll() {
      ['html','css','js'].forEach(id => {
        try { localStorage.setItem(CODE_KEYS[id], document.getElementById(id + 'Code').value); } catch (e) {}
      });
    }

    /* ── AUTO-RUN ── */
    let autoRun = false;
    let runTimer = null;

    function scheduleAutoRun() {
      saveAll();
      if (!autoRun) return;
      clearTimeout(runTimer);
      runTimer = setTimeout(runCode, 700);
    }

    const autoEl = document.getElementById('autoRun');
    try { autoEl.checked = localStorage.getItem('ubRunner_auto') === '1'; } catch (e) {}
    autoRun = autoEl.checked;
    autoEl.addEventListener('change', () => {
      autoRun = autoEl.checked;
      try { localStorage.setItem('ubRunner_auto', autoRun ? '1' : '0'); } catch (e) {}
      if (autoRun) runCode();
    });

    /* ── LIBRARY INJECT ── */
    const LIBS = {
      'jquery': '<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></scr' + 'ipt>',
      'bootstrap': '<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">',
      'tailwind': '<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></scr' + 'ipt>',
      'font-awesome': '<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">',
      'anime': '<script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></scr' + 'ipt>',
      'canvas-confetti': '<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></scr' + 'ipt>',
      'axios': '<script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></scr' + 'ipt>'
    };

    function injectLib() {
      const sel = document.getElementById('libSelect');
      const lib = sel.value;
      const tag = LIBS[lib];
      if (!tag) return;
      const htmlTa = document.getElementById('htmlCode');
      if (htmlTa.value.includes('</head>')) {
        htmlTa.value = htmlTa.value.replace('</head>', tag + '\n</head>');
      } else {
        htmlTa.value = htmlTa.value ? tag + '\n' + htmlTa.value : tag;
      }
      sel.value = '';
      updateLineNumbers('html');
      saveAll();
      runCode();
      showToast('✓ Injected ' + lib.replace('-', ' '));
    }

    /* ── SPLITTER ── */
    const splitter = document.getElementById('splitter');
    const leftPanel = document.getElementById('leftPanel');
    let dragging = false;

    splitter.addEventListener('mousedown', e => {
      dragging = true;
      leftPanel.style.transition = 'none';
      splitter.classList.add('dragging');
      e.preventDefault();
      document.body.style.userSelect = 'none';
    });

    window.addEventListener('mousemove', e => {
      if (!dragging) return;
      const rect = splitter.parentElement.getBoundingClientRect();
      let w = e.clientX - rect.left;
      w = Math.max(280, Math.min(rect.width * 0.85, w));
      leftPanel.style.width = w + 'px';
    });

    window.addEventListener('mouseup', () => {
      if (!dragging) return;
      dragging = false;
      leftPanel.style.transition = '';
      splitter.classList.remove('dragging');
      document.body.style.userSelect = '';
      try { localStorage.setItem('ubRunner_panelW', leftPanel.style.width); } catch (e) {}
    });

    /* ── HOTKEYS ── */
    window.addEventListener('keydown', e => {
      if (e.altKey && ['1','2','3'].includes(e.key)) switchTab(['html','css','js'][Number(e.key) - 1]);
    });

    /* ── CONSOLE INJECTOR ── */
    const CONSOLE_SHIM = `
<script>
(function(){
  const _send = function(type, args) {
    try { window.parent.postMessage({ __consoleType: type, __consoleArgs: Array.from(args).map(a => { try { return typeof a === 'object' ? JSON.stringify(a, null, 2) : String(a); } catch(e){ return String(a); } }).join(' ') }, '*'); } catch(e){}
  };
  ['log','warn','error','info'].forEach(function(m){
    var orig = console[m].bind(console);
    console[m] = function(){ orig.apply(console, arguments); _send(m, arguments); };
  });
  window.addEventListener('error', function(e){ _send('error', [e.message + (e.lineno ? ' (line ' + e.lineno + ')' : '')]); });
  window.addEventListener('unhandledrejection', function(e){ _send('error', ['Unhandled promise rejection: ' + e.reason]); });
})();
<\/script>`;
    function runCode() {
      const html = document.getElementById('htmlCode').value;
      const css  = document.getElementById('cssCode').value;
      const js   = document.getElementById('jsCode').value;

      clearConsole();

      const output = document.getElementById('output');
      const doc = output.contentDocument || output.contentWindow.document;

      const fullCode = `<!DOCTYPE html><html><head><meta charset="UTF-8">${CONSOLE_SHIM}<style>${css}</style></head><body>${html}<script>${js}<\/script></body></html>`;

      doc.open();
      doc.write(fullCode);
      doc.close();

      const btn   = document.getElementById('runButton');
      const label = document.getElementById('runLabel');
      const dot   = document.getElementById('statusDot');

      btn.classList.add('running');
      label.textContent = '✓ Running';
      dot.classList.add('live');

      setTimeout(() => {
        btn.classList.remove('running');
        label.textContent = '▶ Run';
      }, 1500);
    }

    /* ── CLEAR ── */
    function clearCode() {
      document.getElementById('htmlCode').value = '';
      document.getElementById('cssCode').value  = '';
      document.getElementById('jsCode').value   = '';
      ['html','css','js'].forEach(id => {
        try { localStorage.removeItem(CODE_KEYS[id]); } catch (e) {}
      });
      ['html','css','js'].forEach(id => updateLineNumbers(id));

      const output = document.getElementById('output');
      const doc = output.contentDocument || output.contentWindow.document;
      doc.open(); doc.write(''); doc.close();

      document.getElementById('statusDot').classList.remove('live');
    }


    /* ── INIT: RESTORE SAVED CODE + PANEL WIDTH ── */
    (function initRunner() {
      ['html','css','js'].forEach(id => {
        try {
          const v = localStorage.getItem(CODE_KEYS[id]);
          if (v != null) document.getElementById(id + 'Code').value = v;
        } catch (e) {}
      });
      try {
        const w = localStorage.getItem('ubRunner_panelW');
        if (w && document.getElementById('leftPanel')) document.getElementById('leftPanel').style.width = w;
      } catch (e) {}
      ['html','css','js'].forEach(id => updateLineNumbers(id));
    })();
  </script>
</body>
</html>
