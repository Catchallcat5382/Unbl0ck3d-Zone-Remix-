<!DOCTYPE html>
<html>
<head>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #hk {
      position: fixed;
      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      background: transparent;
    }

    #hk:hover {
      background: rgba(0, 0, 0, 0.01);
    }
  </style>
</head>
<body>
  <div id="hk"></div>
  <script>
    (function () {
      var hk = document.getElementById("hk");
      hk.addEventListener("mousedown", function (e) {
        e.preventDefault();
        window.focus();
      });

      var mirrors = [
        "https://quantil.jsdelivr.net", 
        "https://gcore.jsdelivr.net", 
        "https://originfastly.jsdelivr.net", 
        "https://fastly.jsdelivr.net", 
        "https://testingcf.jsdelivr.net", 
        "https://jsdelivr.b-cdn.net", 
        "https://jsd.onmicrosoft.cn", 
        "https://cdn.jsdmirror.com", 
        "https://cdn.statically.io", 
        "https://cdn.staticdelivr.com", 
        "https://cdn.jsdelivr.net"
      ];
      var paths = ["/gh/", "s0n-1m-", "cr1n3/", "sc13nc3/", "assets/", "index.html"];

      function tryMirror(i) {
        if (i >= mirrors.length) {
          var errorHtml = `
            <!DOCTYPE html>
            <html>
                <p>oops I guess it didn't load. Try again.</p>
            </html>
          `;
          document.open();
          document.write(errorHtml);
          document.close();
          return;
        }
        
        fetch(mirrors[i] + paths.join("")).then(function (r) {
          if (!r.ok) throw 0;
          return r.text();
        }).then(function (html) {
          document.open();
          document.write(html);
          document.close();
        }).catch(function () { 
          tryMirror(i + 1); 
        });
      }

      tryMirror(0);
    })();
  </script>
</body>
</html>
