<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unbl0cked Zone Loader</title>
  <style>
    html,body{margin:0;min-height:100%;background:#100703;color:#ff7a1a;font-family:Arial,sans-serif}
    body{display:grid;place-items:center}
    main{max-width:560px;padding:28px;border:1px solid #ff6a00;border-radius:14px;background:#080506;box-shadow:0 0 36px rgba(255,106,0,.22)}
    h1{margin:0 0 10px;font-size:24px}p{line-height:1.45;color:#ffd2a0}.err{color:#ffb4a8;white-space:pre-wrap}button{background:#ff7a1a;color:#160600;border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main id="loader">
    <h1>Loading Unbl0cked Zone</h1>
    <p>Opening the hosted live build. This single file works without an assets folder.</p>
  </main>
  <script>
    (async function () {
      function dec(parts) { return parts.map(function(p){ return atob(p); }).join(''); }
      var rawBaseUrl = dec(['aHR0cHM6Ly9yYXcuZ2l0aHVidXNlcmNvbnRlbnQuY29tLw==','Q2F0Y2hhbGxjYXQ1MzgyL1VuYmwwY2szZC1ab25lLVJlbWl4LS8=','bWFzdGVyL2Fzc2V0cy8=']);
      var pageUrl = rawBaseUrl + 'index.html';
      var communityCssUrl = rawBaseUrl + 'community/community.css';
      var fallbacks = [
        dec(['aHR0cHM6Ly9jZG4uanNkZWxpdnIubmV0L2doLw==','Q2F0Y2hhbGxjYXQ1MzgyL1VuYmwwY2szZC1ab25lLVJlbWl4LUBtYXN0ZXIvYXNzZXRzL2luZGV4Lmh0bWw=']),
        dec(['aHR0cHM6Ly9xdWFudGlsLmpzZGVsaXZyLm5ldC9naC8=','Q2F0Y2hhbGxjYXQ1MzgyL1VuYmwwY2szZC1ab25lLVJlbWl4LUBtYXN0ZXIvYXNzZXRzL2luZGV4Lmh0bWw='])
      ];
      var baseUrl = dec(['aHR0cHM6Ly9yYXcuZ2l0aGFjay5jb20v','Q2F0Y2hhbGxjYXQ1MzgyL1VuYmwwY2szZC1ab25lLVJlbWl4LS8=','bWFzdGVyL2Fzc2V0cy8=']);
      var loader = document.getElementById('loader');
      try {
        var res = await fetch(pageUrl + '?v=' + Date.now(), { cache: 'no-store' });
        for (var i = 0; !res.ok && i < fallbacks.length; i++) res = await fetch(fallbacks[i] + '?v=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('Live build returned HTTP ' + res.status);
        var html = await res.text();
        try {
          var cssRes = await fetch(communityCssUrl + '?v=' + Date.now(), { cache: 'no-store' });
          if (cssRes.ok) {
            var css = await cssRes.text();
            html = html.replace(/<link\s+rel=["']stylesheet["']\s+href=["']community\/community\.css["']\s*>/i, '');
            html = html.replace(/<head([^>]*)>/i, '<head$1><style id="community-inline-css">' + css.replace(/<\/style/gi, '<\\/style') + '</style>');
          }
        } catch (cssErr) {}
        if (/<base\s/i.test(html)) html = html.replace(/<base\s[^>]*>/i, '<base href="' + baseUrl + '">');
        else html = html.replace(/<head([^>]*)>/i, '<head$1><base href="' + baseUrl + '">');
        document.open();
        document.write(html);
        document.close();
      } catch (err) {
        loader.innerHTML = '<h1>Loader failed</h1><p class="err">' + String(err && err.message ? err.message : err).replace(/[&<>]/g, function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c];}) + '</p><button onclick="location.reload()">Retry</button>';
      }
    })();
  </script>
</body>
</html>
