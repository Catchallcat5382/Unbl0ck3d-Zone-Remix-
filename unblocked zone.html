<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unbl0cked Zone Loader</title>
  <style>
    html,body{margin:0;min-height:100%;background:#100703;color:#ff7a1a;font-family:Arial,sans-serif}
    body{display:grid;place-items:center}
    main{max-width:560px;padding:28px;border:1px solid #ff6a00;border-radius:14px;background:#080506;box-shadow:0 0 36px rgba(255,106,0,.22)}
    h1{margin:0 0 10px;font-size:24px}p{line-height:1.45;color:#ffd2a0}.err{color:#ffb4a8;white-space:pre-wrap}button{background:#ff7a1a;color:#160600;border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main id="loader">
    <h1>Loading Unbl0cked Zone</h1>
    <p>Opening the hosted live build. This single file works without an assets folder.</p>
  </main>
  <script>
    (async function () {
      var pageUrl = 'https://raw.githubusercontent.com/Catchallcat5382/Unbl0ck3d-Zone-Remix-/master/assets/index.html';
      var fallbacks = ['https://cdn.jsdelivr.net/gh/Catchallcat5382/Unbl0ck3d-Zone-Remix-@master/assets/index.html', 'https://quantil.jsdelivr.net/gh/Catchallcat5382/Unbl0ck3d-Zone-Remix-@master/assets/index.html'];
      var baseUrl = 'https://raw.githack.com/Catchallcat5382/Unbl0ck3d-Zone-Remix-/master/assets/';
      var loader = document.getElementById('loader');
      try {
        var res = await fetch(pageUrl + '?v=' + Date.now(), { cache: 'no-store' });
        for (var i = 0; !res.ok && i < fallbacks.length; i++) res = await fetch(fallbacks[i] + '?v=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('Live build returned HTTP ' + res.status);
        var html = await res.text();
        if (/<base\s/i.test(html)) html = html.replace(/<base\s[^>]*>/i, '<base href="' + baseUrl + '">');
        else html = html.replace(/<head([^>]*)>/i, '<head$1><base href="' + baseUrl + '">');
        document.open();
        document.write(html);
        document.close();
      } catch (err) {
        loader.innerHTML = '<h1>Loader failed</h1><p class="err">' + String(err && err.message ? err.message : err).replace(/[&<>]/g, function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c];}) + '</p><button onclick="location.reload()">Retry</button>';
      }
    })();
  </script>
</body>
</html>
